<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer control loop -->
  <circle cx="100" cy="100" r="80" stroke="currentColor" stroke-width="4" fill="none" opacity="0.2"/>
  
  <!-- Inner control loop -->
  <circle cx="100" cy="100" r="60" stroke="currentColor" stroke-width="3" fill="none" opacity="0.4"/>
  
  <!-- Central area grid - representing agricultural areas -->
  <g transform="translate(100, 100)">
    <!-- 3x3 grid of areas -->
    <rect x="-20" y="-20" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    <rect x="-4" y="-20" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    <rect x="12" y="-20" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    
    <rect x="-20" y="-4" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    <rect x="-4" y="-4" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    <rect x="12" y="-4" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    
    <rect x="-20" y="12" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    <rect x="-4" y="12" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    <rect x="12" y="12" width="12" height="12" fill="currentColor" opacity="0.9" rx="1"/>
    
    <!-- Central monitoring/control point -->
    <circle cx="0" cy="0" r="6" fill="currentColor"/>
  </g>
  
  <!-- Flow arrows indicating the control loop cycle -->
  <!-- Top arrow -->
  <path d="M 100 20 L 100 35" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 100 35 L 95 30 M 100 35 L 105 30" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Right arrow -->
  <path d="M 180 100 L 165 100" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 165 100 L 170 95 M 165 100 L 170 105" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Bottom arrow -->
  <path d="M 100 180 L 100 165" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 100 165 L 95 170 M 100 165 L 105 170" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Left arrow -->
  <path d="M 20 100 L 35 100" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 35 100 L 30 95 M 35 100 L 30 105" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
